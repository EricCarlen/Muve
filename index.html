<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muve | Join the Muvement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative background: small stick figures doing exercises, very
         low opacity so they add texture without competing with content. -->
    <div class="bg-figures" aria-hidden="true">
        <svg class="fig fig1" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L30 40 M30 20 L10 5 M30 20 L50 5 M30 40 L10 60 M30 40 L50 60"/></svg>
        <svg class="fig fig2" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L30 35 M30 22 L45 25 M30 22 L45 18 M30 35 L18 50 L15 65 M30 35 L42 50 L45 65"/></svg>
        <svg class="fig fig3" viewBox="0 0 60 70"><circle cx="8" cy="35" r="6"/><path d="M14 35 L45 35 M20 35 L20 50 M35 35 L35 50 M45 35 L60 40"/></svg>
        <svg class="fig fig4" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L33 35 M31 20 L15 30 M31 20 L45 10 M33 35 L45 55 M33 35 L20 45 L15 60"/></svg>
        <svg class="fig fig5 accent" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L30 35 M30 20 L15 15 M30 20 L45 15 M30 35 L15 45 L12 62 M30 35 L48 50 L55 65"/></svg>
        <svg class="fig fig6" viewBox="0 0 60 70"><circle cx="30" cy="8" r="6"/><path d="M30 14 L30 42 M30 18 L8 8 M30 18 L52 8 M30 42 L10 65 M30 42 L50 65"/></svg>
        <svg class="fig fig7 accent" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L30 40 M30 20 L10 5 M30 20 L50 5 M30 40 L10 60 M30 40 L50 60"/></svg>
        <svg class="fig fig8" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L33 35 M31 20 L15 30 M31 20 L45 10 M33 35 L45 55 M33 35 L20 45 L15 60"/></svg>
        <svg class="fig fig9" viewBox="0 0 60 70"><circle cx="30" cy="10" r="6"/><path d="M30 16 L30 35 M30 22 L45 25 M30 22 L45 18 M30 35 L18 50 L15 65 M30 35 L42 50 L45 65"/></svg>
        <svg class="fig fig10" viewBox="0 0 60 70"><circle cx="8" cy="35" r="6"/><path d="M14 35 L45 35 M20 35 L20 50 M35 35 L35 50 M45 35 L60 40"/></svg>
    </div>

    <header class="main-header">
        <h1 id="brand-logo">MUVE</h1>
        <span id="greeting"></span>
    </header>

    <div class="category-grid single-column">
        <button class="filter-btn" onclick="filterWorkouts('morning', this)">
            <span>Morning</span>
        </button>
        <button class="filter-btn" onclick="filterWorkouts('upper body', this)">
            <span>Upper Body</span>
        </button>
        <button class="filter-btn" onclick="filterWorkouts('core', this)">
            <span>Core</span>
        </button>
        <button class="filter-btn" onclick="filterWorkouts('lower body', this)">
            <span>Lower Body</span>
        </button>
        <button class="filter-btn" onclick="filterWorkouts('mobility side', this)">
            <span>Mobility</span>
        </button>
        <button class="filter-btn" onclick="filterWorkouts('evening', this)">
            <span>Evening</span>
        </button>
    </div>

    <p id="signin-prompt" class="signin-prompt">Sign in to unlock the full workout library and build your own.</p>

    <div id="my-workouts-section" class="my-workouts-section" style="display:none;">
        <h2 class="section-title">My Workouts</h2>
        <div class="category-grid" id="my-workouts-grid"></div>
    </div>

    <!-- WORKOUT OVERLAY -->
    <div id="workout-overlay" class="overlay">
        <!-- TOP HEADER BAR -->
        <div class="workout-header">
            <div class="header-left">
                <button class="close-btn" onclick="closeWorkout()">&#8592;</button>
            </div>

            <h1 id="overlay-title">WORKOUT</h1>

            <div class="header-right">
                <div class="header-toggle">
                    <span>List</span>
                    <label class="switch small">
                        <input type="checkbox" id="mode-toggle" onchange="refreshWorkoutView()" checked>
                        <span class="slider round"></span>
                    </label>
                    <span>Timed</span>
                </div>
            </div>
        </div>

        <!-- CENTER CONTROLS -->
        <div class="workout-controls" id="workout-controls">
            <button id="play-pause-btn" class="control-btn" onclick="togglePlayPause()">&#9658;</button>
            <button id="skip-btn" class="control-btn" onclick="skipStep()">&#10141;</button>
        </div>

        <!-- WORKOUT CONTENT -->
        <div id="overlay-content"></div>

        <!-- BOTTOM TIMER -->
        <div class="timer-container">
            <div class="timer-header">
                <div class="timer-spacer"></div>
                <div id="active-tip">Get ready...</div>
                <div id="timer-countdown">0:00</div>
            </div>

            <div id="progress-background">
                <div id="progress" class="timer-bar"></div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <div class="footer-left">
            <span>Day <span id="day-of-year">--</span></span>
        </div>

        <div class="footer-center" id="auth-area">
            <button id="login-btn" class="auth-btn" onclick="openAuthForm()">Sign In</button>
            <div id="profile-btn" class="profile-chip" style="display:none;" onclick="toggleProfileMenu()">
                <span id="profile-name"></span>
                <div class="profile-menu">
                    <button onclick="openHistory()">My Log History</button>
                    <button onclick="signOutUser()">Sign Out</button>
                </div>
            </div>
        </div>

        <!-- LOGIN / SIGN UP OVERLAY -->
        <div id="auth-overlay" class="auth-overlay">
            <div class="auth-card">
                <button class="close-btn" id="auth-close" onclick="closeAuthForm()">&#8592;</button>
                <h2 id="auth-title">Sign In</h2>

                <input type="email" id="auth-email" class="auth-input" placeholder="Email" autocomplete="email">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password" autocomplete="current-password">

                <div id="auth-error" class="auth-error"></div>

                <button class="auth-submit" id="auth-submit" onclick="submitAuthForm()">Sign In</button>

                <div class="auth-links">
                    <a href="#" onclick="toggleAuthMode(); return false;" id="auth-toggle-mode">Need an account? Sign Up</a>
                    <a href="#" onclick="handleForgotPassword(); return false;">Forgot password?</a>
                </div>
            </div>
        </div>

        <div class="footer-right">
            <span>Week <span id="week-of-year">--</span></span>
        </div>
    </footer>

    <script type="module" src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
